<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八上國文自學選文一：六朝名士畫廊——《世說新語》選</title>
    <style>
        :root {
            --bg-page: #FAF9F5;
            --card-bg: #FFFFFF;
            --green-dark: #1E5641;
            --green-box-bg: #F1F6F3;
            --green-border: #3B7A61;
            --yellow-bg: #F6EED6;
            --yellow-text: #4A3B18;
            --text-main: #222222;
            --text-sub: #4E5452;
            --accent-orange: #B85D3B;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: rgba(30, 86, 65, 0.2);
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        .header-bar {
            background-color: var(--green-dark);
            color: #FFFFFF;
            padding: 20px 16px 0;
            text-align: center;
        }

        .header-bar h1 {
            margin: 0 0 4px 0;
            font-size: 1.45rem;
            letter-spacing: 0.5px;
        }

        .header-bar p {
            margin: 0 0 16px 0;
            font-size: 0.92rem;
            opacity: 0.92;
        }

        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tab-btn {
            flex: 1;
            display: block;
            padding: 13px 10px;
            background-color: rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            border: none;
            border-radius: 10px 10px 0 0;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .tab-btn.active {
            background-color: var(--bg-page);
            color: var(--green-dark);
        }

        .main-wrap {
            max-width: 900px;
            margin: 22px auto 60px;
            padding: 0 16px;
        }

        .page-panel {
            display: none;
        }

        .page-panel.active {
            display: block;
        }

        .checklist {
            background-color: var(--green-box-bg);
            border-left: 4px solid var(--green-dark);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 22px;
            font-size: 0.96rem;
        }

        .checklist label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            cursor: pointer;
        }

        .checklist input[type="checkbox"] {
            width: 19px;
            height: 19px;
            accent-color: var(--green-dark);
        }

        .card-box {
            background: var(--card-bg);
            border: 1px solid #E5E2D9;
            border-radius: 14px;
            padding: 26px 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .card-box h2 {
            margin: 0 0 10px 0;
            color: var(--green-dark);
            font-size: 1.35rem;
            border-bottom: 2px solid var(--green-box-bg);
            padding-bottom: 8px;
        }

        .guide-item {
            border: 1px solid #E2DFD5;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .guide-btn {
            width: 100%;
            text-align: left;
            background-color: #F8F7F2;
            border: none;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--green-dark);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guide-btn:hover {
            background-color: var(--green-box-bg);
        }

        .guide-body {
            display: none;
            padding: 16px 18px;
            background-color: #FFFFFF;
            border-top: 1px solid #E2DFD5;
            font-size: 1rem;
        }

        .guide-body.open {
            display: block;
        }

        .lesson-title {
            font-size: 1.75rem;
            font-weight: bold;
            color: #1A2421;
            margin: 0 0 8px 0;
            font-family: "Noto Serif TC", "PMingLiU", serif;
        }

        .lesson-meta {
            font-size: 0.96rem;
            color: #333333;
            margin: 0 0 6px 0;
            font-weight: 500;
        }

        .lesson-hint {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin: 0 0 18px 0;
        }

        .classical-box {
            background-color: var(--green-box-bg);
            border-left: 4px solid var(--green-dark);
            padding: 20px 22px;
            margin-bottom: 16px;
            font-size: 1.38rem;
            line-height: 2.35;
            color: #1F2623;
            font-family: "Noto Serif TC", "PMingLiU", serif;
        }

        .classical-box p {
            margin: 0 0 10px 0;
        }

        .classical-box p:last-child {
            margin-bottom: 0;
        }

        .kw {
            display: inline-block;
            border: 1.5px solid var(--green-border);
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--green-dark);
            border-radius: 8px;
            padding: 0 7px;
            margin: 0 2px;
            line-height: 1.55;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
        }

        .kw:hover {
            background-color: #DFECE5;
        }

        .kw.selected {
            background-color: var(--green-dark);
            color: #FFFFFF;
            border-color: var(--green-dark);
        }

        .gloss-bar {
            background-color: var(--yellow-bg);
            color: var(--yellow-text);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1.02rem;
            margin-bottom: 16px;
            min-height: 52px;
        }

        .gloss-bar strong {
            color: var(--green-dark);
            margin-right: 6px;
        }

        .trans-toggle-btn {
            background: none;
            border: none;
            color: var(--green-dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .trans-content {
            display: none;
            margin-top: 10px;
            background-color: #F8F7F2;
            border: 1px solid #E2DFD5;
            border-radius: 10px;
            padding: 16px 18px;
            font-size: 1.05rem;
            line-height: 1.85;
        }

        .trans-content.open {
            display: block;
        }

        .trans-content p {
            margin: 0 0 10px 0;
        }

        .trans-content p:last-child {
            margin-bottom: 0;
        }

        .next-row {
            text-align: right;
            margin-top: 16px;
        }

        .next-btn {
            background-color: var(--green-dark);
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .next-btn:hover {
            opacity: 0.92;
        }

        .quiz-item {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid #ECE9E0;
        }

        .quiz-q {
            font-weight: bold;
            font-size: 1.08rem;
            margin-bottom: 10px;
        }

        .quiz-options label {
            display: block;
            padding: 10px 14px;
            margin-bottom: 8px;
            border: 1.5px solid #DCD9CE;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .quiz-options label:hover {
            background-color: var(--green-box-bg);
        }

        .quiz-options input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.15);
            accent-color: var(--green-dark);
        }

        .exp-box {
            display: none;
            margin-top: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .exp-box.right {
            display: block;
            background: #E5F5EC;
            color: #1A5236;
            border: 1px solid #A8D8BE;
        }

        .exp-box.wrong {
            display: block;
            background: #FDECEA;
            color: #8A1F17;
            border: 1px solid #F5B7B1;
        }

        .submit-quiz-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--accent-orange);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .score-box {
            display: none;
            background-color: var(--green-dark);
            color: #FFFFFF;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 22px;
        }

        @media (max-width: 600px) {
            .classical-box {
                font-size: 1.2rem;
                padding: 16px;
            }
            .card-box {
                padding: 20px 16px;
            }
            .tab-btn {
                font-size: 0.9rem;
                padding: 11px 6px;
            }
        }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>六朝名士畫廊——《世說新語》選</h1>
    <p>八年級國文自學選文一 ｜ 平板互動自學任務</p>
    <div class="tab-bar">
        <button type="button" class="tab-btn active" id="tabBtn1" onclick="openTab(1)">① 經典導讀 (5分)</button>
        <button type="button" class="tab-btn" id="tabBtn2" onclick="openTab(2)">② 點詞語譯與抄寫 (25分)</button>
        <button type="button" class="tab-btn" id="tabBtn3" onclick="openTab(3)">③ 文意小測驗 10題 (15分)</button>
    </div>
</div>

<div class="main-wrap">

    <div class="checklist">
        <strong>📌 本節課自學任務檢核表（完成後可自行打勾）：</strong>
        <label><input type="checkbox"> 任務一：瀏覽「① 經典導讀」，認識《世說新語》與魏晉名士風貌。</label>
        <label><input type="checkbox"> 任務二：點選「② 點詞語譯」中的綠色詞語框看解釋，並將分段白話抄寫在課本 P.169、P.171。</label>
        <label><input type="checkbox"> 任務三：完成「③ 文意小測驗」共 10 題（每題 10 分），檢視錯題解析。</label>
    </div>

    <!-- 分頁 1：經典導讀 -->
    <div class="page-panel active" id="panel1">

            <h2>《世說新語》小檔案（課本 P.166）</h2>
