<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八上國文自學選文一：《世說新語》選</title>
    <style>
        :root {
            --bg-page: #FAF9F5;
            --card-bg: #FFFFFF;
            --green-dark: #1E5641;
            --green-box-bg: #F1F6F3;
            --green-border: #3B7A61;
            --yellow-bg: #F6EED6;
            --yellow-text: #4A3B18;
            --text-main: #222222;
            --text-sub: #4E5452;
            --accent-orange: #B85D3B;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        /* 頂部簡易導覽列 */
        .top-nav {
            background-color: var(--green-dark);
            color: #FFFFFF;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .top-nav-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .site-title {
            font-size: 1.15rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.18);
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.35);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.92rem;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #FFFFFF;
            color: var(--green-dark);
        }

        /* 主容器 */
        .container {
            max-width: 920px;
            margin: 24px auto 60px;
            padding: 0 18px;
        }

        .section-panel {
            display: none;
        }

        .section-panel.active {
            display: block;
        }

        /* 經典導讀精簡條 */
        .intro-banner {
            background: #FFFFFF;
            border: 1px solid #E2DFD5;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            font-size: 0.96rem;
            color: var(--text-sub);
        }

        .intro-banner summary {
            font-weight: bold;
            color: var(--green-dark);
            cursor: pointer;
            font-size: 1.05rem;
        }

        /* 篇章區塊（仿截圖風格） */
        .lesson-block {
            background: var(--card-bg);
            border: 1px solid #E5E2D9;
            border-radius: 14px;
            padding: 28px 26px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .lesson-title {
            font-size: 1.75rem;
            font-weight: bold;
            color: #1A2421;
            margin: 0 0 8px 0;
            font-family: "Noto Serif TC", "PMingLiU", serif;
        }

        .lesson-meta {
            font-size: 0.95rem;
            color: #333333;
            margin: 0 0 8px 0;
            font-weight: 500;
        }

        .lesson-hint {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin: 0 0 18px 0;
        }

        /* 淺綠底原文框（左側深綠粗線） */
        .classical-box {
            background-color: var(--green-box-bg);
            border-left: 4px solid var(--green-dark);
            padding: 20px 22px;
            margin-bottom: 16px;
            font-size: 1.38rem;
            line-height: 2.35;
            color: #1F2623;
            font-family: "Noto Serif TC", "PMingLiU", serif;
        }

        .classical-box p {
            margin: 0 0 10px 0;
        }

        .classical-box p:last-child {
            margin-bottom: 0;
        }

        /* 可點選的綠色圓角詞語框 */
        .kw {
            display: inline-block;
            border: 1.5px solid var(--green-border);
            background-color: rgba(255, 255, 255, 0.55);
            color: var(--green-dark);
            border-radius: 8px;
            padding: 0 7px;
            margin: 0 2px;
            line-height: 1.55;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .kw:hover {
            background-color: #DFECE5;
        }

        .kw.selected {
            background-color: var(--green-dark);
            color: #FFFFFF;
            border-color: var(--green-dark);
        }

        /* 下方暖黃色即時解釋橫幅 */
        .gloss-bar {
            background-color: var(--yellow-bg);
            color: var(--yellow-text);
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1.02rem;
            margin-bottom: 16px;
            min-height: 52px;
            display: flex;
            align-items: center;
        }

        .gloss-bar strong {
            color: var(--green-dark);
            margin-right: 6px;
        }

        /* 看分段白話折疊區 */
        details.trans-details {
            margin-top: 6px;
        }

        details.trans-details summary {
            color: var(--green-dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
            list-style: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        details.trans-details summary::-webkit-details-marker {
            display: none;
        }

        details.trans-details summary::before {
            content: "▸";
            font-size: 0.9rem;
            transition: transform 0.2s;
        }

        details.trans-details[open] summary::before {
            transform: rotate(90deg);
        }

        .trans-content {
            margin-top: 12px;
            background-color: #F8F7F2;
            border: 1px solid #E2DFD5;
            border-radius: 10px;
            padding: 16px 18px;
            font-size: 1.05rem;
            line-height: 1.85;
            color: #2B2B2B;
        }

        .trans-content p {
            margin: 0 0 10px 0;
        }

        .trans-content p:last-child {
            margin-bottom: 0;
        }

            border: 1px solid
