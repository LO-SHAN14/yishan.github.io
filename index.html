<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>八上國文自學選文一：六朝名士畫廊——《世說新語》選</title>
    <style>
        :root {
            --bg-page: #FAF9F5;
            --card-bg: #FFFFFF;
            --green-dark: #1E5641;
            --green-box-bg: #F1F6F3;
            --green-border: #3B7A61;
            --yellow-bg: #F6EED6;
            --yellow-text: #4A3B18;
            --text-main: #222222;
            --text-sub: #4E5452;
            --accent-orange: #B85D3B;
        }

        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Noto Serif TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: rgba(30, 86, 65, 0.2);
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        /* 頂部標題與三分頁導覽（不使用 sticky，避免平板/預覽框圖層遮擋點擊） */
        .header-bar {
            background-color: var(--green-dark);
            color: #FFFFFF;
            padding: 20px 16px 0;
            text-align: center;
        }

        .header-bar h1 {
            margin: 0 0 4px 0;
            font-size: 1.45rem;
            letter-spacing: 0.5px;
        }

        .header-bar p {
            margin: 0 0 16px 0;
            font-size: 0.92rem;
            opacity: 0.92;
        }

        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tab-btn {
            flex: 1;
            display: block;
            padding: 13px 10px;
            background-color: rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            border: none;
            border-radius: 10px 10px 0 0;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .tab-btn.active {
            background-color: var(--bg-page);
            color: var(--green-dark);
        }

        /* 主內容容器 */
        .main-wrap {
            max-width: 900px;
            margin: 22px auto 60px;
            padding: 0 16px;
        }

        .page-panel {
            display: none;
        }

        .page-panel.active {
            display: block;
        }

        /* 任務檢核表 */
        .checklist {
            background-color: var(--green-box-bg);
            border-left: 4px solid var(--green-dark);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 22px;
            font-size: 0.96rem;
        }

        .checklist label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
            cursor: pointer;
        }

        .checklist input[type="checkbox"] {
            width: 19px;
            height: 19px;
            accent-color: var(--green-dark);
        }

        /* 卡片區塊 */
        .card-box {
            background: var(--card-bg);
            border: 1px solid #E5E2D9;
            border-radius: 14px;
            padding: 26px 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .card-box h2 {
            margin: 0 0 10px 0;
            color: var(--green-dark);
            font-size: 1.35rem;
            border-bottom: 2px solid var(--green-box-bg);
            padding-bottom: 8px;
        }

        /* 導讀折疊項目 */
        .guide-item {
            border: 1px solid #E2DFD5;
            border-radius: 10px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .guide-btn {
            width: 100%;
            text-align: left;
            background-color: #F8F7F2;
            border: none;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--green-dark);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guide-btn:hover {
            background-color: var(--green-box-bg);
        }

        .guide-body {
            display: none;
            padding: 16px 18px;
            background-color: #FFFFFF;
            border-top: 1px solid #E2DFD5;
            font-size: 1rem;
        }

        .guide-body.open {
            display: block;
        }

        /* 原典精選（仿截圖極簡排版） */
        .lesson-title {
            font-size: 1.75rem;
            font-weight: bold;
            color: #1A2421;
            margin: 0 0 8px 0;
            font-family: "Noto Serif TC", "PMingLiU", serif;
        }

        .lesson-meta {
            font-size: 0.96rem;
            color: #333333;
            margin: 0 0 6px 0;
            font-weight: 500;
        }

        .lesson-hint {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin: 0 0 18px 0;
        }
